<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEE-ME SEE-U</title>
<style>
 html,body{margin:0;height:100%;background:#0e0f12;overflow:hidden}
 /* 进展签 / 选择页的那几次：第一帧就是纸，不先闪一块深底（docs/47）。
    令牌到了之后由 first-screen.css 接手，这一行只管样式表到达之前 */
 html.sb-first-screen,html.sb-first-screen body{background:#fafafa}
 canvas{display:block}
 /* 跨页过渡（docs/47）。type.css 里也有一份，但这一页的样式表是脚本带进来的，晚于第一帧。
    叠层的底 = 这一页第一帧的底：缺省透明会透出白 */
 @view-transition{navigation:auto}
 ::view-transition{background:#0e0f12}
 html.sb-first-screen::view-transition{background:#fafafa}
 @media (prefers-reduced-motion: reduce){@view-transition{navigation:none}}
</style>
<script>
 // 第一帧的底色：ui/transitions.ts 的 groundFor() 在这里的一份抄本（测试逐条对）。
 // 这一刻还没有任何模块，所以只能抄。main.ts 的 adoptPrepaint() 接过这一份 hold。
 (function(){var q=new URLSearchParams(location.search);if(q.get('selftest')!=='1'&&!q.get('theme'))document.documentElement.classList.add('sb-first-screen')})();
 // 跨页过渡的看门狗（ui/transitions.ts 的 SETTLE_MS）。模块到达之前这一页就可能被揭开 ——
 // 现场（没有目录，也就没有 page-transition.ts）只有这一份
 addEventListener('pagereveal',function(e){var v=e.viewTransition;if(v){var t=setTimeout(function(){v.skipTransition()},1260);v.finished.finally(function(){clearTimeout(t)}).catch(function(){})}});
</script></head>
<body><script type="module">
 // 两条路，都是字面量 import —— 打包器照样能静态分析，两个 chunk 互不牵连。
 //
 // `/about` 曾经也在这里分支（它没有自己的 .html，靠 vercel.json 的 rewrite）。
 // 现在它是 `about.html`，和 lineage / making / passport 一样是真页面 ——
 // 因为 cleanUrls 打开之后 rewrite 和它打架，线上 /about 直接 404。
 //
 // ?selftest=1   开场自检页，同样**不启动主程序**：它要在"主程序起不来"的时候
 //               也能打开，所以它不能是主程序的一部分。
 // 其余          正常进作品。
 if (new URLSearchParams(location.search).get('selftest') === '1') {
   document.documentElement.style.overflow = 'auto';
   import('./src/shell/selftest.ts');
 } else {
   import('./src/main.ts');
 }
</script></body>
</html>
