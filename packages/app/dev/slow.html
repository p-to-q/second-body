    用一张<strong>画出来的</strong>剪影，打真的 <code>/__slow</code>，跑真的 <code>createSlowLoop</code>。
    验的是前端那一半：提交 → 轮询 → 取 glb → <code>graft()</code> 到底被没被调用。

    不带 <code>SLOW_FAKE=1</code> 起 dev server 的话，这一页会真的打 Rodin、真的花钱。
