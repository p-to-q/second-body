<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>取景模式 · SEE-ME SEE-U</title>
<link rel="stylesheet" href="../src/ui/type.css">
<style>
  body { padding: var(--sb-safe); }
  .row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--sb-gutter); margin-top: 1.5em; }
  canvas { width: 100%; background: #0a0b0d; border: 1px solid var(--sb-rule); display: block; }
  #num div { padding: 0.35em 0; border-bottom: 1px solid var(--sb-rule); font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
  #num div:first-child { font-size: 16px; }
  .bar { display: flex; gap: 1em; align-items: baseline; flex-wrap: wrap; margin-top: 1em; }
  button, select { font: inherit; }
  figcaption { margin-top: 0.6em; color: var(--sb-ink-dim); }
</style>
</head>
<body>
<main>
  <p class="sb-label">DEV · 取景模式</p>
  <h1>只露上半身，还是退后让它看见全身</h1>
  <p style="max-width:var(--sb-measure)">
    分类器（<code>core/src/autoframe.ts</code>）每一帧在想什么。左边是摄像头画面里的 33 个点：
    实心 = 可信（可见度 ≥ 0.4），空心 = 不可信；膝踝四点加粗。下面那条是最近 20 秒的模式时间线。
    没有摄像头时播一段合成的"坐近 → 站起来 → 退后 → 再走近"，和 <code>core/test/autoframe.test.ts</code> 喂的是同一段。
  </p>
  <div class="bar">
    <button id="cam" type="button">用摄像头</button>
    <label>策略 <select id="policy"><option>auto</option><option>full</option><option>upper</option></select></label>
    <label><input id="kiosk" type="checkbox"> 现场（全身优先）</label>
    <span id="src" class="sb-label"></span>
  </div>
  <div class="row">
    <figure style="margin:0">
      <canvas id="view" width="640" height="360"></canvas>
      <canvas id="line" width="640" height="56" style="margin-top:8px"></canvas>
      <figcaption>时间线：灰 = full · 琥珀 = upper · 蓝 = stepping-back · 黑 = 没有人。竖线 = 一次切换</figcaption>
    </figure>
    <div id="num"></div>
  </div>
</main>
<script type="module" src="./framing.ts"></script>
<script type="module" src="./devnav.ts"></script>
</body>
</html>
