<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SEE-ME SEE-U · 物种阵列 A1</title>
<link rel="stylesheet" href="/src/ui/type.css">
<link rel="stylesheet" href="./poster.css">
<style>
  @page { size: 594mm 841mm; margin: 0; }
  .p-sheet { width: 594mm; height: 841mm; }

  /* 5 × 5。23 个条目 + 1 格计数 = 24，最后一格是空的 —— 末行留白，不硬凑 */
  .plate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9mm 8mm; }
  .cell { display: flex; flex-direction: column; }

  /* 图直接落在纸上。不用卡片、不用边框、不用阴影 —— 反面清单第一条 */
  .fig { width: 100%; aspect-ratio: 1; position: relative; }
  .fig img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /**
   * 空位：没有 anchor 图的那两个条目。
   * 它们不是"漏印了" —— 它们的内容就是"没有"，所以留一个真的空。
   * 一条细对角线，只为了让人知道这个空是**排出来的**，不是印坏了。
   */
  .fig.vacant { border: var(--p-rule) solid var(--sb-rule); }
  .fig.vacant::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top right,
      transparent calc(50% - 0.12mm), var(--sb-rule) 50%, transparent calc(50% + 0.12mm));
  }

  .cap { margin-top: 3mm; border-top: var(--p-rule) solid var(--sb-rule); padding-top: 2mm; }
  .cap .zh { font-size: var(--p-h3); color: var(--sb-ink); line-height: 1.1; display: block; letter-spacing: -0.015em; }
  .cap .en { font-size: var(--p-small); color: var(--sb-ink-dim); line-height: 1.15; display: block; margin-top: 0.15em; }
  .cap .tl { font-size: var(--p-micro); color: var(--sb-ink-dim); line-height: 1.3; display: block; margin-top: 1.8mm; }
  .cap .tle { font-size: var(--p-micro); color: var(--sb-ink-dim); opacity: .62; line-height: 1.3; display: block; }
  .cell.vac .cap .zh { color: var(--sb-ink-dim); }

  /* 第 24 格：计数。它是一个格子，不是一个角标 */
  .tally { display: flex; flex-direction: column; justify-content: flex-end; }
  .tally .big { font-family: var(--sb-mono); font-size: 32mm; line-height: 0.9; color: var(--sb-ink); letter-spacing: -0.03em; }
  .tallyrow { display: flex; justify-content: space-between; align-items: baseline; padding: 1.2mm 0; border-top: var(--p-rule) solid var(--sb-rule); }
</style>
</head>
<body>

<section class="p-sheet">
  <div class="p-safe">

    <!-- ── 报头 ──────────────────────────────────────────────────── -->
    <header>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <p class="p-label">物种谱系 / Species</p>
        <p class="p-label-micro" id="head-right"></p>
      </div>
      <h1 class="p-h1 p-bi" style="margin-top:4mm">
        <span class="sb-zh">你可以变成的那些身体</span>
        <span class="sb-en">The bodies you can become</span>
      </h1>
    </header>

    <hr class="p-rule p-rule-ink" style="margin-top:5mm">

    <!-- ── 阵列 ──────────────────────────────────────────────────── -->
    <div class="plate" id="plate" style="margin-top:6mm"></div>

    <div class="p-spacer"></div>

    <!-- ── 说明 + 版权行 ─────────────────────────────────────────── -->
    <hr class="p-rule" style="margin-top:6mm">
    <div class="p-cols" style="grid-template-columns:1.25fr 1fr;gap:0 14mm;margin-top:4mm">
      <p class="p-small" id="statement"></p>
      <p class="p-small p-bi" id="invite"></p>
    </div>

    <hr class="p-rule" style="margin-top:5mm">
    <div class="p-colophon">
      <p class="p-micro" style="max-width:290mm" id="colophon-l"></p>
      <p class="p-micro p-mono" style="text-align:right" id="colophon-r"></p>
    </div>

  </div>
</section>

<script src="./shot.js"></script>
<script src="./data.js"></script>
<script>
(() => {
  const D = window.SB_POSTER, C = D.counts;
  const n = (x) => x.toLocaleString('en-US');
  const $ = (id) => document.getElementById(id);
  const b = (s) => `<b class="p-ink" style="font-weight:600">${s}</b>`;
  const m = (s) => `<span class="p-mono p-ink">${s}</span>`;

  // 按形态空间排序 —— 网格不是字母表，它是 01 号海报那张散点图被拉成一条线。
  // 从"最不像人"走到"最像人"，观众横着扫一遍就是穿越形态空间。
  const order = [...D.entries].sort((a, z) =>
    (a.axes?.humanLike ?? 0) - (z.axes?.humanLike ?? 0) ||
    (a.axes?.lifeLike ?? 0) - (z.axes?.lifeLike ?? 0));

  $('plate').innerHTML = order.map((e) => {
    const fig = e.anchor
      ? `<div class="fig"><img src="/refs/${e.id}/_anchor.png" alt="${e.nameEn}"></div>`
      : `<div class="fig vacant"></div>`;
    return `<div class="cell${e.anchor ? '' : ' vac'}">${fig}` +
      `<div class="cap">` +
        `<span class="zh">${e.name}</span>` +
        `<span class="en">${e.nameEn}</span>` +
        `<span class="tl">${e.tagline}</span>` +
        `<span class="tle">${e.taglineEn}</span>` +
      `</div></div>`;
  }).join('') +
  // 第 24 格
  `<div class="cell tally">
     <div class="big">${C.entries}</div>
     <div style="margin-top:3mm">
       ${Object.entries(D.byKind).sort((a, z) => z[1] - a[1]).map(([k, v]) => {
         const ZH = { archetype: '物种', character: '角色', guest: '嘉宾' };
         return `<div class="tallyrow"><span class="p-small p-ink">${ZH[k] ?? k}</span>` +
                `<span class="p-small p-mono p-dim">${v}</span></div>`;
       }).join('')}
       <div class="tallyrow"><span class="p-small p-dim">空位 Vacant</span><span class="p-small p-mono p-dim">${C.vacancies}</span></div>
     </div>
   </div>`;

  $('head-right').textContent =
    `${C.entries} 个条目 · ${C.plans} 种身体方案 · 按形态空间排序，从最不像人到最像人`;

  // 这一页是零件，不是身体 —— 说清楚，然后把人请到现场
  $('statement').innerHTML =
    `这 ${C.entriesWithAnchor} 张图不是 ${C.entriesWithAnchor} 只机器人，` +
    `它们是同一个部位：每个物种的${b('躯干参考件')}。<br><br>` +
    `把它们排在一起，是因为这是唯一一个所有物种都有的槽位 —— 也因为，` +
    `${b('辨识度住在整体剪影里，不在零件里')}。一段小腿不会让你认出它属于谁。` +
    `所以这一页只是零件；整具身体在装置里，用你自己的骨架站起来。`;

  $('invite').innerHTML =
    `<span class="sb-zh">站到画面里。选一个身体。它会用你的身体活过来 —— ` +
    `${C.boneKeys - 1} 根骨头，1:1 等身，延迟不超过 200 毫秒。</span>` +
    `<span class="sb-en">Step into the frame. Choose a body. It comes alive using yours — ` +
    `${C.boneKeys - 1} bones, life-size, under 200 ms.</span>`;

  $('colophon-l').innerHTML =
    `SEE-ME SEE-U / 看我看你<br>` +
    `图：${m('assets/refs/&lt;id&gt;/_anchor.png')}，每个条目的躯干参考件，本项目自行渲染。<br>` +
    `名称、对照、坐标与计数由 ${m('poster/build-data.mjs')} 从 ${m('assets/parts/parts.json')} 现读。`;
  $('colophon-r').innerHTML =
    `${C.entries} 条目 · ${C.entriesWithAnchor} 张图 · ${C.vacancies} 个空位<br>` +
    `${C.parts} 件部件 · ${C.slots} 个槽位 · ${C.plans} 种身体方案<br>` +
    `parts.json v${D.source.partsVersion} · ${D.source.partsGeneratedAt.slice(0, 10)}`;
})();
</script>
</body>
</html>
